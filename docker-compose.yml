services:
  postgres:
    image: postgres:16-alpine
    container_name: emi-catalog-db
    environment:
      POSTGRES_USER: emi_user
      POSTGRES_PASSWORD: emi_password
      POSTGRES_DB: emi_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emi_user -d emi_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
